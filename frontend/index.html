<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Today · macros</title>
  <meta name="description" content="Meals eaten and left today, calories left, and extras.">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/today.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="/" aria-label="macros home">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
          <rect x="1" y="9" width="6" height="16" rx="2" fill="var(--tint-2)"/>
          <rect x="10" y="1" width="6" height="24" rx="2" fill="var(--accent)"/>
          <rect x="19" y="13" width="6" height="12" rx="2" fill="var(--tint-1)"/>
        </svg>
        macros
      </a>
      <nav class="links" aria-label="Pages">
        <a href="/" aria-current="page">Today</a>
        <a href="/targets.html">Targets</a>
      </nav>
    </header>

    <main class="layout" id="today" data-state="loading">
      <section>
        <span class="date num" id="date">Today</span>
        <div class="left" aria-live="polite"><b class="num" id="left">0000</b><span id="left-label">kcal left</span></div>
        <p class="of" id="of"><span class="num">0000 of 0000 kcal eaten</span></p>

        <div class="dayline" id="dayline" aria-hidden="true"></div>
        <div class="daylegend" aria-hidden="true">
          <span><i class="done"></i>Meals eaten</span>
          <span><i></i>Still to eat</span>
          <span><i class="extra"></i>Extras</span>
        </div>

        <h2>Extras</h2>
        <div class="extras" id="extras"></div>
        <p class="hint" id="extras-empty" hidden>Nothing outside your meals yet.</p>

        <form class="adder" id="extra-form" novalidate autocomplete="off">
          <div class="combo" id="extra-pick">
            <label class="sr-only" for="extra-search">Search ingredients</label>
            <div class="input">
              <input id="extra-search" placeholder="Add something you ate" role="combobox"
                     aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
            </div>
            <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
          </div>

          <div class="amount" id="extra-amount" hidden>
            <p class="picked"><b id="picked-name"></b> <button type="button" class="link" id="picked-change">Change</button></p>
            <div class="amount-row">
              <div class="input">
                <input id="extra-grams" type="number" inputmode="decimal" min="0" step="any" aria-label="Grams">
                <span>g</span>
              </div>
              <span class="calc" id="extra-calc"></span>
              <button class="btn-sec" type="submit">Add</button>
            </div>
          </div>

          <div class="amount" id="extra-manual" hidden>
            <p class="picked"><b>Add by hand</b> <button type="button" class="link" id="manual-cancel">Cancel</button></p>
            <div class="manual-row">
              <div class="input"><input id="manual-name" aria-label="Food name" placeholder="Name"></div>
              <div class="input">
                <input id="manual-kcal" type="number" inputmode="decimal" min="0" step="any" aria-label="kcal">
                <span>kcal</span>
              </div>
              <button class="btn-sec" type="submit">Add</button>
            </div>
          </div>
          <p class="error" id="extra-error" role="alert" hidden></p>
        </form>
      </section>

      <section>
        <div class="meals-list" id="meal-list"></div>
        <p class="error" id="meal-error" role="alert" hidden></p>

        <div class="chooser" id="chooser" hidden>
          <header>
            <h3 id="chooser-title"></h3>
            <button type="button" class="link" id="chooser-cancel">Cancel</button>
          </header>
          <div class="input">
            <input id="recipe-search" placeholder="Search recipes" aria-label="Search recipes">
          </div>
          <ul class="recipes" id="recipes" role="listbox" aria-label="Recipes"></ul>
          <div class="preview" id="preview" hidden>
            <div class="preview-head"><span class="label">Your portion</span><b id="preview-kcal"></b></div>
            <dl class="qty" id="preview-items"></dl>
            <button type="button" class="btn" id="eat">I ate this</button>
          </div>
          <p class="error" id="chooser-error" role="alert" hidden></p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
