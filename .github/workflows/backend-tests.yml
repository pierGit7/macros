name: Backend Tests

on:
  push:
    branches: [main]
    paths: &backend
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths: *backend

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: build
        run: go build ./...

      - name: test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...

      - name: coverage total
        run: go tool cover -func=cover.out | tail -1

      - name: smoke test GET /recipes
        run: |
          go build -o /tmp/macros .
          /tmp/macros & pid=$!
          trap "kill $pid" EXIT
          for _ in $(seq 1 40); do
            curl -sf localhost:8080/recipes >/dev/null && break || sleep 0.25
          done
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' localhost:8080/recipes)
          test "$code" = "200"
          test "$(python3 -c 'import json; print(len(json.load(open("/tmp/body.json"))))')" = "138"

  checks:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "::error::not gofmt-ed"; echo "$out"; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: backend
