name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# never two deploys at once; a newer push waits for the running one instead of cancelling it
concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build ${{ matrix.component }} (arm64)
    needs: test
    if: github.ref == 'refs/heads/main' # workflow_dispatch from another branch must not overwrite :latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: pi
    steps:
      - uses: actions/checkout@v6

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH key
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy compose file
        env:
          PI: ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$PI" 'mkdir -p ~/app'
          scp -o StrictHostKeyChecking=accept-new deploy/docker-compose.yml "$PI:~/app/docker-compose.yml"

      - name: Pull and restart
        env:
          PI: ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # token goes over stdin, never on a command line; logout afterwards so the
          # (soon expired) token is not left in the Pi's docker config
          printf '%s' "$GITHUB_TOKEN" | ssh -o StrictHostKeyChecking=accept-new "$PI" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && cd ~/app && docker compose pull && docker compose up -d && docker image prune -f; \
             status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
